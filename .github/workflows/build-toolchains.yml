          - {package: libjpeg-turbo, os: windows, arch: amd64, runner: windows-2022,      version: "3.0.3", build_type: cmake, configure_flags: "", source_url: "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.3/libjpeg-turbo-3.0.3.tar.gz", source_sha256: "343e789069fc7afbcdfe44dbba7dbbf45afa98a15150e079a38e60e44578865d"}

          # ── libffi 3.4.6 ──────────────────────────────────────────────────

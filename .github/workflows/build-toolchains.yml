          - {package: curl, os: darwin, arch: arm64, runner: macos-14,          version: "8.21.0", build_type: autoconf, configure_flags: "--with-openssl --enable-shared --enable-static --with-zlib --without-libpsl", source_url: "https://curl.se/download/curl-8.21.0.tar.gz", source_sha256: "d9b327997999045a24cda50f3983e69e51c516bd8be6ef9842fc7f99135e33bb"}

          # ── libxml2 2.13.5 ────────────────────────────────────────────────
          - {package: libxml2, os: linux,  arch: amd64, runner: ubuntu-22.04,     version: "2.13.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static --without-python --with-zlib", source_url: "https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.5.tar.xz", source_sha256: "74fc163217a3964257d3be39af943e08861258db0724727a4a7470c0f4991fdf"}

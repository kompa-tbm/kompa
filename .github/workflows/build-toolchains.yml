          - {package: libpng, os: darwin,  arch: arm64, runner: macos-14,          version: "1.6.58", build_type: cmake, configure_flags: "-DPNG_SHARED=ON -DPNG_STATIC=ON", source_url: "https://sourceforge.net/projects/libpng/files/libpng16/1.6.58/libpng-1.6.58.tar.gz", source_sha256: "8c9b05b675ca7301a458df2c2e46f26e1d41ff36b8863f8c33530bc58c2e6225"}
          - {package: libpng, os: windows, arch: amd64, runner: windows-2022,      version: "1.6.58", build_type: cmake, configure_flags: "-DPNG_SHARED=ON -DPNG_STATIC=ON", source_url: "https://sourceforge.net/projects/libpng/files/libpng16/1.6.58/libpng-1.6.58.tar.gz", source_sha256: "8c9b05b675ca7301a458df2c2e46f26e1d41ff36b8863f8c33530bc58c2e6225"}

          # ── libjpeg-turbo 3.0.3 ───────────────────────────────────────────

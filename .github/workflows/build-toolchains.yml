          # ══════════════════════════════════════════════════════════════════

          # ── zstd 1.5.7 ────────────────────────────────────────────────────
          - {package: zstd, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "1.5.7", build_type: cmake, configure_flags: "-DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=ON", source_url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz",   source_sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"}
          - {package: zstd, os: linux,   arch: arm64, runner: ubuntu-22.04-arm, version: "1.5.7", build_type: cmake, configure_flags: "-DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=ON", source_url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz",   source_sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"}
          - {package: zstd, os: darwin,  arch: arm64, runner: macos-14,          version: "1.5.7", build_type: cmake, configure_flags: "-DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=ON", source_url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz",   source_sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"}
          - {package: zstd, os: windows, arch: amd64, runner: windows-2022,      version: "1.5.7", build_type: cmake, configure_flags: "-DZSTD_BUILD_SHARED=ON -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=ON", source_url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz",   source_sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3", cmake_source_subdir: "build/cmake"}

          # ── libpng 1.6.58 ─────────────────────────────────────────────────
          - {package: libpng, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "1.6.58", build_type: cmake, configure_flags: "-DPNG_SHARED=ON -DPNG_STATIC=ON", source_url: "https://sourceforge.net/projects/libpng/files/libpng16/1.6.58/libpng-1.6.58.tar.gz", source_sha256: "8c9b05b675ca7301a458df2c2e46f26e1d41ff36b8863f8c33530bc58c2e6225"}

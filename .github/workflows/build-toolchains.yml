          - {package: lua, os: darwin, arch: arm64, runner: macos-14,      version: "5.4.7", build_type: lua_make, source_url: "https://www.lua.org/ftp/lua-5.4.7.tar.gz", source_sha256: "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"}

          # ── Zig ───────────────────────────────────────────────────────────
          - {package: zig, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "0.13.0", build_type: zig_prebuilt, source_url: "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz",      source_sha256: "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"}
          - {package: zig, os: linux,   arch: arm64, runner: ubuntu-22.04-arm, version: "0.13.0", build_type: zig_prebuilt, source_url: "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz",   source_sha256: "041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556"}
          - {package: zig, os: darwin,  arch: arm64, runner: macos-14,          version: "0.13.0", build_type: zig_prebuilt, source_url: "https://ziglang.org/download/0.13.0/zig-macos-aarch64-0.13.0.tar.xz",   source_sha256: "46fae219656545dfaf4dce12fb4e8685cec5b51d721beee9389ab4194d43394c"}
          - {package: zig, os: windows, arch: amd64, runner: windows-2022,      version: "0.13.0", build_type: zig_prebuilt, source_url: "https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip",     source_sha256: "d859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158"}


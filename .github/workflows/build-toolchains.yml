          # ── expat 2.8.3 ───────────────────────────────────────────────────
          - {package: expat, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "2.8.3", build_type: cmake, configure_flags: "-DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_BUILD_TESTS=OFF", source_url: "https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz", source_sha256: "f6256df90c906773d344da084402b7d3e4f22ed41b1a59c989098a83d3ea0c85"}

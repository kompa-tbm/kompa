          - {package: libxml2, os: darwin, arch: arm64, runner: macos-14,          version: "2.13.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static --without-python --with-zlib", source_url: "https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.5.tar.xz", source_sha256: "74fc163217a3964257d3be39af943e08861258db0724727a4a7470c0f4991fdf"}

          # ── gettext 0.22.5 ────────────────────────────────────────────────
          - {package: gettext, os: linux,  arch: amd64, runner: ubuntu-22.04,     version: "0.22.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static --disable-java --disable-csharp --without-emacs", source_url: "https://ftpmirror.gnu.org/gnu/gettext/gettext-0.22.5.tar.gz", source_sha256: "ec1705b1e969b83a9f073144ec806151db88127f5e40fe5a94cb6c8fa48996a0"}
          - {package: gettext, os: linux,  arch: arm64, runner: ubuntu-22.04-arm, version: "0.22.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static --disable-java --disable-csharp --without-emacs", source_url: "https://ftpmirror.gnu.org/gnu/gettext/gettext-0.22.5.tar.gz", source_sha256: "ec1705b1e969b83a9f073144ec806151db88127f5e40fe5a94cb6c8fa48996a0"}
          - {package: gettext, os: darwin, arch: arm64, runner: macos-14,          version: "0.22.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static --disable-java --disable-csharp --without-emacs", source_url: "https://ftpmirror.gnu.org/gnu/gettext/gettext-0.22.5.tar.gz", source_sha256: "ec1705b1e969b83a9f073144ec806151db88127f5e40fe5a94cb6c8fa48996a0"}

          # ══════════════════════════════════════════════════════════════════
          # NEW PACKAGES — git-sourced builds
          # ══════════════════════════════════════════════════════════════════

          # ── LuaJIT 2.1 (rolling release, build from v2.1 branch) ──────────
          # No versioned tarballs exist; luajit.org explicitly states git-only
          - {package: luajit, os: linux,  arch: amd64, runner: ubuntu-22.04,     version: "2.1", build_type: luajit_make, git_url: "https://github.com/LuaJIT/LuaJIT.git", git_ref: "v2.1", source_url: "", source_sha256: ""}
          - {package: luajit, os: linux,  arch: arm64, runner: ubuntu-22.04-arm, version: "2.1", build_type: luajit_make, git_url: "https://github.com/LuaJIT/LuaJIT.git", git_ref: "v2.1", source_url: "", source_sha256: ""}
          - {package: luajit, os: darwin, arch: arm64, runner: macos-14,          version: "2.1", build_type: luajit_make, git_url: "https://github.com/LuaJIT/LuaJIT.git", git_ref: "v2.1", source_url: "", source_sha256: ""}

          # ── mruby 4.0.0 ───────────────────────────────────────────────────
          - {package: mruby, os: linux,  arch: amd64, runner: ubuntu-22.04,     version: "4.0.0", build_type: mruby_rake, source_url: "https://github.com/mruby/mruby/archive/refs/tags/4.0.0.tar.gz", source_sha256: ""}
          - {package: mruby, os: linux,  arch: arm64, runner: ubuntu-22.04-arm, version: "4.0.0", build_type: mruby_rake, source_url: "https://github.com/mruby/mruby/archive/refs/tags/4.0.0.tar.gz", source_sha256: ""}
          - {package: mruby, os: darwin, arch: arm64, runner: macos-14,          version: "4.0.0", build_type: mruby_rake, source_url: "https://github.com/mruby/mruby/archive/refs/tags/4.0.0.tar.gz", source_sha256: ""}

          # ── musl libc 1.2.5 (Linux only — it IS a Linux libc) ─────────────
          - {package: musl, os: linux, arch: amd64, runner: ubuntu-22.04,     version: "1.2.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static", source_url: "https://musl.libc.org/releases/musl-1.2.5.tar.gz", source_sha256: "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4"}
          - {package: musl, os: linux, arch: arm64, runner: ubuntu-22.04-arm, version: "1.2.5", build_type: autoconf, configure_flags: "--enable-shared --enable-static", source_url: "https://musl.libc.org/releases/musl-1.2.5.tar.gz", source_sha256: "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4"}

    steps:
      - uses: actions/checkout@v4

      # ── Install build dependencies ────────────────────────────────────────
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config autoconf automake libtool \
            libssl-dev zlib1g-dev xz-utils curl zstd bzip2 ruby rake \
            gettext libncurses-dev libreadline-dev

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja zstd xz autoconf automake libtool pkg-config \
            openssl@3 ruby

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja 7zip perl nasm

      # ── Download source (tarball packages) ───────────────────────────────
      - name: Download source archive
        if: matrix.source_url != ''
        shell: bash
        run: |
          mkdir -p build/src
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "build/src/${ARCHIVE_NAME}" "${{ matrix.source_url }}"
          echo "Downloaded ${ARCHIVE_NAME}"

      # ── Clone source (git packages) ───────────────────────────────────────
      - name: Clone source (git)
        if: matrix.source_url == '' && matrix.git_url != ''
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ matrix.git_ref }}" \
            "${{ matrix.git_url }}" build/source
          echo "Cloned ${{ matrix.git_url }} @ ${{ matrix.git_ref }}"

      # ── Verify checksum (Linux) ───────────────────────────────────────────
      - name: Verify source checksum (Linux)
        if: runner.os == 'Linux' && matrix.source_sha256 != '' && matrix.source_url != ''
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          echo "${{ matrix.source_sha256 }}  build/src/${ARCHIVE_NAME}" | sha256sum --check
          echo "✓ Checksum verified"

      - name: Verify source checksum (macOS)
        if: runner.os == 'macOS' && matrix.source_sha256 != '' && matrix.source_url != ''
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          echo "${{ matrix.source_sha256 }}  build/src/${ARCHIVE_NAME}" | shasum -a 256 --check
          echo "✓ Checksum verified"

      - name: Verify source checksum (Windows)
        if: runner.os == 'Windows' && matrix.source_url != ''
        shell: pwsh
        run: |
          $expected = "${{ matrix.source_sha256 }}"
          if ($expected -eq "") {
            Write-Host "No SHA-256 for this package; skipping checksum verification."
          } else {
            $archive = "build/src/$((Split-Path '${{ matrix.source_url }}' -Leaf))"
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Error "Checksum mismatch: expected $expected, got $actual"
              exit 1
            }
            Write-Host "✓ Checksum verified"
          }

      # ── Extract source (tarball, Unix) ────────────────────────────────────
      - name: Extract source (Unix)
        if: runner.os != 'Windows' && matrix.source_url != ''
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          mkdir -p build/source
          case "${ARCHIVE_NAME}" in
            *.tar.xz|*.tar.gz|*.tar.bz2|*.tar.zst)
              tar -xf "build/src/${ARCHIVE_NAME}" -C build/source --strip-components=1
              ;;
            *.zip)
              TMP=$(mktemp -d)
              unzip -q "build/src/${ARCHIVE_NAME}" -d "${TMP}"
              INNER=$(find "${TMP}" -mindepth 1 -maxdepth 1 -type d | head -1)
              mv "${INNER}"/* build/source/
              ;;
          esac
          echo "Source extracted."

      - name: Extract source (Windows)
        if: runner.os == 'Windows' && matrix.source_url != ''
        shell: pwsh
        run: |
          $archive = "build/src/$((Split-Path '${{ matrix.source_url }}' -Leaf))"
          New-Item -ItemType Directory -Force build\source | Out-Null
          if ($archive -match '\.zip$') {
            $tmp = New-TemporaryFile | ForEach-Object { Remove-Item $_; New-Item -Type Directory $_ }
            Expand-Archive -Path $archive -DestinationPath $tmp
            $inner = Get-ChildItem $tmp | Select-Object -First 1
            Get-ChildItem $inner.FullName | ForEach-Object { Move-Item $_.FullName build\source\ }
          } else {
            tar -xf $archive -C build\source --strip-components=1
          }
          Write-Host "Source extracted."

      # ══════════════════════════════════════════════════════════════════════
      # BUILD STEPS — one conditional per build_type
      # ══════════════════════════════════════════════════════════════════════

      # ── autoconf (generic) ────────────────────────────────────────────────
      - name: Build (autoconf)
        if: matrix.build_type == 'autoconf' && runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p build/build_dir && cd build/build_dir
          ../source/configure \
            --prefix="${INSTALL_DIR}" \
            ${{ matrix.configure_flags }} 2>&1 | tail -10
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      # ── cmake (generic, Unix) ─────────────────────────────────────────────
      - name: Build (cmake, Unix)
        if: matrix.build_type == 'cmake' && runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          SRC="build/source"
          # Some packages (zstd) need cmake to point at a subdirectory
          [ -n "${{ matrix.cmake_source_subdir }}" ] && SRC="${SRC}/${{ matrix.cmake_source_subdir }}" || true
          cmake -S "${SRC}" -B build/build_dir \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            ${{ matrix.configure_flags }}
          cmake --build build/build_dir --parallel
          cmake --install build/build_dir

      # ── cmake (generic, Windows) ──────────────────────────────────────────
      - name: Build (cmake, Windows)
        if: matrix.build_type == 'cmake' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL = "$PWD\build\install"
          $SRC = "build\source"
          if ("${{ matrix.cmake_source_subdir }}" -ne "") { $SRC = "$SRC\${{ matrix.cmake_source_subdir }}" }
          cmake -S $SRC -B build\build_dir `
            -DCMAKE_INSTALL_PREFIX="$INSTALL" `
            -DCMAKE_BUILD_TYPE=Release `
            ${{ matrix.configure_flags }}
          cmake --build build\build_dir --config Release --parallel
          cmake --install build\build_dir --config Release

      # ── cmake_amalgamation (SQLite Windows) ───────────────────────────────
      - name: Build SQLite amalgamation (Windows)
        if: matrix.build_type == 'cmake_amalgamation'
        shell: pwsh
        run: |
          $SRC = "$PWD\build\source"
          $BUILD = "$PWD\build\build_dir"
          $INSTALL = "$PWD\build\install"
          New-Item -ItemType Directory -Force $BUILD, "$INSTALL\bin", "$INSTALL\lib", "$INSTALL\include" | Out-Null
          @"
          cmake_minimum_required(VERSION 3.16)
          project(sqlite3 C)
          add_library(sqlite3 SHARED sqlite3.c)
          target_compile_definitions(sqlite3 PRIVATE SQLITE_ENABLE_MATH_FUNCTIONS
            SQLITE_ENABLE_FTS5 SQLITE_ENABLE_RTREE SQLITE_THREADSAFE=1 SQLITE_DQS=0)
          set_target_properties(sqlite3 PROPERTIES WINDOWS_EXPORT_ALL_SYMBOLS ON)
          add_executable(sqlite3_shell shell.c)
          target_link_libraries(sqlite3_shell sqlite3)
          set_target_properties(sqlite3_shell PROPERTIES OUTPUT_NAME sqlite3)
          install(TARGETS sqlite3 sqlite3_shell RUNTIME DESTINATION bin
            LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)
          install(FILES sqlite3.h sqlite3ext.h DESTINATION include)
          "@ | Set-Content "$SRC\CMakeLists.txt"
          cmake -S $SRC -B $BUILD -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$INSTALL
          cmake --build $BUILD --config Release --parallel
          cmake --install $BUILD --config Release

      # ── Lua make ──────────────────────────────────────────────────────────
      - name: Build Lua (make)
        if: matrix.build_type == 'lua_make'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}"
          cd build/source
          case "${{ matrix.os }}" in
            linux)  PLAT=linux ;;
            darwin) PLAT=macosx ;;
            *)      PLAT=posix ;;
          esac
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          make -j${NPROC} MYCFLAGS="-fPIC" ${PLAT}
          make install INSTALL_TOP="${INSTALL_DIR}"

      # ── Zig prebuilt ──────────────────────────────────────────────────────
      - name: Repackage Zig (Unix)
        if: matrix.build_type == 'zig_prebuilt' && runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}/bin"
          cp build/source/zig "${INSTALL_DIR}/bin/zig"
          chmod +x "${INSTALL_DIR}/bin/zig"
          cp -r build/source/lib "${INSTALL_DIR}/" 2>/dev/null || true
          cp -r build/source/doc "${INSTALL_DIR}/" 2>/dev/null || true
          echo "Zig: $("${INSTALL_DIR}/bin/zig" version)"

      - name: Repackage Zig (Windows)
        if: matrix.build_type == 'zig_prebuilt' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL = "$PWD\build\install"
          New-Item -ItemType Directory -Force "$INSTALL\bin" | Out-Null
          Copy-Item build\source\zig.exe "$INSTALL\bin\zig.exe"
          if (Test-Path build\source\lib) { Copy-Item -Recurse build\source\lib  "$INSTALL\lib" }
          if (Test-Path build\source\doc) { Copy-Item -Recurse build\source\doc  "$INSTALL\doc" }
          Write-Host "Zig: $(& "$INSTALL\bin\zig.exe" version)"

      # ── bzip2 (plain Makefile) ────────────────────────────────────────────
      - name: Build bzip2 (make)
        if: matrix.build_type == 'bzip2_make'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}"
          cd build/source
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # Build shared library variant first
          make -f Makefile-libbz2_so -j${NPROC}
          # Build static library and tools
          make -j${NPROC}
          make install PREFIX="${INSTALL_DIR}"
          # Copy shared library
          cp libbz2.so.1.0.8 libbz2.so.1.0 "${INSTALL_DIR}/lib/" 2>/dev/null || true
          cp libbz2.so.1.0 "${INSTALL_DIR}/lib/libbz2.so" 2>/dev/null || true

      # ── OpenSSL (custom Configure script) ────────────────────────────────
      - name: Build OpenSSL
        if: matrix.build_type == 'openssl_build'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          cd build/source
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          perl Configure \
            ${{ matrix.configure_flags }} \
            --prefix="${INSTALL_DIR}" \
            --openssldir="${INSTALL_DIR}/ssl" \
            shared \
            no-tests
          make -j${NPROC}
          make install_sw   # skip man pages to save time

      # ── LuaJIT (make) ─────────────────────────────────────────────────────
      - name: Build LuaJIT
        if: matrix.build_type == 'luajit_make'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          cd build/source
          make -j${NPROC} PREFIX="${INSTALL_DIR}"
          make install PREFIX="${INSTALL_DIR}"

      # ── mruby (rake) ──────────────────────────────────────────────────────
      - name: Build mruby
        if: matrix.build_type == 'mruby_rake'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}"
          cd build/source
          rake MRUBY_CONFIG="" 2>&1 | tail -20
          # mruby installs into build/host by default; copy to our prefix
          mkdir -p "${INSTALL_DIR}/bin" "${INSTALL_DIR}/lib"
          cp build/host/bin/mruby build/host/bin/mrbc build/host/bin/mirb \
             "${INSTALL_DIR}/bin/" 2>/dev/null || true
          cp -r build/host/lib/* "${INSTALL_DIR}/lib/" 2>/dev/null || true
          cp -r include "${INSTALL_DIR}/" 2>/dev/null || true

      # ══════════════════════════════════════════════════════════════════════
      # PACKAGE + UPLOAD
      # ══════════════════════════════════════════════════════════════════════

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          ARTIFACT_DIR="${PWD}/artifacts"
          mkdir -p "${ARTIFACT_DIR}"
          if [ -z "$(ls -A ${INSTALL_DIR} 2>/dev/null)" ]; then
            echo "ERROR: install directory is empty!" && exit 1
          fi
          ARTIFACT_NAME="${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTIFACT_FILE="${ARTIFACT_NAME}.tar.zst"
          tar -C "${INSTALL_DIR}" -c . | zstd -T0 -19 -o "${ARTIFACT_DIR}/${ARTIFACT_FILE}"
          cd "${ARTIFACT_DIR}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ARTIFACT_FILE}" > "${ARTIFACT_FILE}.sha256"
          else
            shasum -a 256 "${ARTIFACT_FILE}" > "${ARTIFACT_FILE}.sha256"
          fi
          echo "Packaged: ${ARTIFACT_FILE} ($(du -sh ${ARTIFACT_FILE} | cut -f1))"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL = "$PWD\build\install"
          $ARTIFACTS = "$PWD\artifacts"
          New-Item -ItemType Directory -Force $ARTIFACTS | Out-Null
          if (-not (Get-ChildItem $INSTALL -ErrorAction SilentlyContinue)) {
            Write-Error "Install directory is empty!" && exit 1
          }
          $ARTIFACT_NAME = "${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}"
          $ARTIFACT_FILE = "${ARTIFACT_NAME}.zip"
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "$ARTIFACTS\$ARTIFACT_FILE" "$INSTALL\*"
          $hash = (Get-FileHash "$ARTIFACTS\$ARTIFACT_FILE" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARTIFACT_FILE" | Set-Content "$ARTIFACTS\$ARTIFACT_FILE.sha256"
          Write-Host "Packaged: $ARTIFACT_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7

  # ── Generate manifest and publish release ─────────────────────────────────
  release:
    name: Publish release ${{ needs.next-tag.outputs.tag }}
    needs: [next-tag, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate manifest.json
        env:
          RELEASE_TAG: ${{ needs.next-tag.outputs.tag }}
          REPO: kompa-tbm/kompa
        run: |
          python3 - << 'PYEOF'
          import json, os, glob
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          artifact_dir = "release-artifacts"

          packages = []
          for sha_file in sorted(glob.glob(f"{artifact_dir}/**/*.sha256", recursive=True)):
              with open(sha_file) as f:
                  line = f.read().strip()
              parts = line.split(None, 1)
              if len(parts) != 2:
                  continue
              sha256 = parts[0]
              archive_name = os.path.basename(parts[1].strip())

              base = archive_name
              for ext in [".tar.zst", ".tar.gz", ".tar.xz", ".zip"]:
                  if base.endswith(ext):
                      base = base[:-len(ext)]
                      break

              segs = base.split("-")
              if len(segs) < 3:
                  continue
              # Handle packages with hyphens in the name (e.g. libjpeg-turbo, c-ares)
              # Convention: name-os-arch where os is linux/darwin/windows
              os_idx = None
              for i, s in enumerate(segs):
                  if s in ("linux", "darwin", "windows"):
                      os_idx = i
                      break
              if os_idx is None or os_idx == 0:
                  continue
              pkg_name = "-".join(segs[:os_idx])
              pkg_os   = segs[os_idx]
              pkg_arch = "-".join(segs[os_idx+1:])

              archive_path = os.path.join(os.path.dirname(sha_file), archive_name)
              size = os.path.getsize(archive_path) if os.path.exists(archive_path) else 0

              packages.append({
                  "schema_version": 1,
                  "name": pkg_name,
                  "version": "latest",
                  "platform": f"{pkg_os}-{pkg_arch}",
                  "os": pkg_os,
                  "architecture": pkg_arch,
                  "archive": archive_name,
                  "sha256": sha256,
                  "size": size,
                  "download_url": f"{base_url}/{archive_name}",
                  "dependencies": [],
                  "build_time": datetime.now(timezone.utc).isoformat(),
                  "kompa_version": "0.1.0",
                  "release_tag": tag,
              })

          manifest = {
              "schema_version": 1,
              "release_tag": tag,
              "build_time": datetime.now(timezone.utc).isoformat(),
              "kompa_version": "0.1.0",
              "packages": packages,
          }
          out = "release-artifacts/manifest.json"
          with open(out, "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated manifest with {len(packages)} package entries → {out}")
          PYEOF

      - name: Create and push tag
        run: |
          TAG="${{ needs.next-tag.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Toolchain release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-tag.outputs.tag }}
          name: "Kompa Toolchains ${{ needs.next-tag.outputs.tag }}"
          files: release-artifacts/**
          generate_release_notes: false
          body: |
            ## Toolchain Release ${{ needs.next-tag.outputs.tag }}

            Pre-built packages from official upstream sources, verified by SHA-256.

            ### Packages in this release
            zstd · libpng · libjpeg-turbo · pcre2 · ncurses · bzip2 · xz/liblzma ·
            expat · libffi · c-ares · libuv · curl · libxml2 · gettext · readline ·
            openssl · luajit · mruby · musl · sqlite · zlib · lua · zig

            ### Install
            ```bash
            kompa install sqlite
            kompa install openssl curl libxml2
            kompa install zstd libpng libjpeg-turbo
            ```

            The `manifest.json` attached to this release lists all packages with their checksums and download URLs.

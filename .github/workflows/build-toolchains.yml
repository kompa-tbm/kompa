name: Build Toolchains

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of packages to build (e.g. 'gcc lua sqlite'), or 'all'"
        required: false
        default: "all"
  schedule:
    # Rebuild toolchains weekly on Sunday at 02:00 UTC.
    - cron: "0 2 * * 0"

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# build_type legend
#   autoconf          – ./configure && make && make install  (no extra flags)
#   autoconf_flags    – autoconf with custom configure_flags from matrix
#   cmake             – cmake -S … -B … && cmake --build && cmake --install
#   cmake_win         – cmake only on Windows (package uses cmake everywhere)
#   lua_make          – Lua's platform-flavoured make
#   zig_prebuilt      – unpack the official Zig prebuilt tarball/zip
#   git_cmake         – clone from git and build with cmake (no tarball hash)
#   git_make          – clone from git and build with make
#   git_autoconf      – clone from git and build with autoconf
#   musl_only         – Linux-only autoconf build (musl libc cross-tool)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Determine next sequential release tag ─────────────────────────────────
  next-tag:
    name: Determine next release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next vN tag
        id: tag
        run: |
          MAX=0
          while IFS= read -r t; do
            N="${t#v}"
            if [[ "$N" =~ ^[0-9]+$ ]] && (( N > MAX )); then MAX=$N; fi
          done < <(git tag --list 'v[0-9]*')
          NEXT=$((MAX + 1))
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: v${NEXT}"

  # ── Build matrix ───────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.package }} (${{ matrix.os }}/${{ matrix.arch }})
    needs: next-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ══════════════════════════════════════════════════════════════════
          # EXISTING PACKAGES (kept intact)
          # ══════════════════════════════════════════════════════════════════

          # ── SQLite ────────────────────────────────────────────────────────
          - {package: sqlite, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "3.46.1", build_type: autoconf, source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz",           source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"}
          - {package: sqlite, os: linux,   arch: arm64, runner: ubuntu-22.04-arm, version: "3.46.1", build_type: autoconf, source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz",           source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"}
          - {package: sqlite, os: darwin,  arch: arm64, runner: macos-14,          version: "3.46.1", build_type: autoconf, source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz",           source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"}
          - {package: sqlite, os: windows, arch: amd64, runner: windows-2022,      version: "3.46.1", build_type: cmake_amalgamation, source_url: "https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip", source_sha256: ""}

          # ── zlib ──────────────────────────────────────────────────────────
          - {package: zlib, os: linux,   arch: amd64, runner: ubuntu-22.04,     version: "1.3.1", build_type: cmake, source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz", source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"}
          - {package: zlib, os: darwin,  arch: arm64, runner: macos-14,          version: "1.3.1", build_type: cmake, source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz", source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"}
          - {package: zlib, os: windows, arch: amd64, runner: windows-2022,      version: "1.3.1", build_type: cmake, source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz", source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"}

          # ── Lua ───────────────────────────────────────────────────────────

name: Build Toolchains

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of packages to build (e.g. 'gcc lua sqlite'), or 'all'"
        required: false
        default: "all"
  schedule:
    # Build toolchains weekly on Sunday at 02:00 UTC to pick up upstream patches.
    - cron: "0 2 * * 0"

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Each job builds one package for one platform from upstream source.
# The matrix is the authoritative record of what Kompa distributes.
# ---------------------------------------------------------------------------
jobs:
  # -------------------------------------------------------------------------
  # Determine the next sequential release tag (v1, v2, v3 …)
  # -------------------------------------------------------------------------
  next-tag:
    name: Determine next release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: tag
        run: |
          # List all vN tags, find the highest N, output v(N+1).
          MAX=0
          while IFS= read -r tag; do
            N="${tag#v}"
            if [[ "$N" =~ ^[0-9]+$ ]] && (( N > MAX )); then
              MAX=$N
            fi
          done < <(git tag --list 'v[0-9]*')
          NEXT=$((MAX + 1))
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: v${NEXT}"

  # -------------------------------------------------------------------------
  # Build each package for each supported OS/arch.
  # Only platforms listed as supported in the package registry are attempted.
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.package }} (${{ matrix.os }}/${{ matrix.arch }})
    needs: next-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── GCC ───────────────────────────────────────────────────────────
          - package: gcc
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "14.2.0"
            source_url: "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
            source_sha256: "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"
          - package: gcc
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "14.2.0"
            source_url: "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
            source_sha256: "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"

          # ── Binutils ──────────────────────────────────────────────────────
          - package: binutils
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "2.42"
            source_url: "https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz"
            source_sha256: "f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800"
          - package: binutils
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "2.42"
            source_url: "https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz"
            source_sha256: "f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800"

          # ── SQLite ────────────────────────────────────────────────────────
          - package: sqlite
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
          - package: sqlite
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
          - package: sqlite
            os: darwin
            arch: amd64
            runner: macos-13
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
          - package: sqlite
            os: darwin
            arch: arm64
            runner: macos-14
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
          - package: sqlite
            os: windows
            arch: amd64
            runner: windows-2022
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"

          # ── zlib ──────────────────────────────────────────────────────────
          - package: zlib
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "1.3.1"
            source_url: "https://zlib.net/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
          - package: zlib
            os: darwin
            arch: arm64
            runner: macos-14
            version: "1.3.1"
            source_url: "https://zlib.net/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
          - package: zlib
            os: windows
            arch: amd64
            runner: windows-2022
            version: "1.3.1"
            source_url: "https://zlib.net/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"

          # ── Lua ───────────────────────────────────────────────────────────
          - package: lua
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "5.4.7"
            source_url: "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
            source_sha256: "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"
          - package: lua
            os: darwin
            arch: arm64
            runner: macos-14
            version: "5.4.7"
            source_url: "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
            source_sha256: "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"

          # ── Zig ───────────────────────────────────────────────────────────
          - package: zig
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
            source_sha256: "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"
          - package: zig
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz"
            source_sha256: "041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0bf37"
          - package: zig
            os: darwin
            arch: aarch64
            runner: macos-14
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-macos-aarch64-0.13.0.tar.xz"
            source_sha256: "46fae219656545b6af4b4a28e4e4de34b0547bba47c6fe887ad89c5a5c5c8193"
          - package: zig
            os: windows
            arch: amd64
            runner: windows-2022
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip"
            source_sha256: "d859994725ef9402381e557c60bb57497215682e355204cc476e8a7c36e30f49"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install build dependencies (Linux) ────────────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
            xz-utils wget curl

      # ── Install build dependencies (macOS) ────────────────────────────────
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config gmp mpfr libmpc xz

      # ── Install build dependencies (Windows) ──────────────────────────────
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake ninja 7zip

      # ── Download and verify source ────────────────────────────────────────
      - name: Download source archive
        shell: bash
        run: |
          mkdir -p build/src
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          curl -fsSL --retry 3 -o "build/src/${ARCHIVE_NAME}" "${{ matrix.source_url }}"
          echo "Downloaded: ${ARCHIVE_NAME}"

      - name: Verify source checksum
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          echo "${{ matrix.source_sha256 }}  build/src/${ARCHIVE_NAME}" | sha256sum --check
          echo "Source checksum verified."

      # ── Extract source ────────────────────────────────────────────────────
      - name: Extract source
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          mkdir -p build/source
          case "${ARCHIVE_NAME}" in
            *.tar.xz|*.tar.gz|*.tar.bz2|*.tar.zst)
              tar -xf "build/src/${ARCHIVE_NAME}" -C build/source --strip-components=1
              ;;
            *.zip)
              mkdir -p build/source_zip
              cd build/source_zip
              unzip -q "../../build/src/${ARCHIVE_NAME}"
              INNER=$(ls -d */ | head -1)
              mv "${INNER}"* ../source/ 2>/dev/null || mv "${INNER}"/* ../source/
              ;;
          esac
          echo "Source extracted."

      # ── Build (autoconf) ──────────────────────────────────────────────────
      - name: Configure and build (autoconf)
        if: ${{ contains(fromJSON('["gcc","binutils","sqlite","lua"]'), matrix.package) }}
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p build/build_dir
          cd build/build_dir

          EXTRA_FLAGS=""
          case "${{ matrix.package }}" in
            gcc)
              EXTRA_FLAGS="--enable-languages=c,c++,fortran --disable-multilib --disable-bootstrap"
              ;;
            binutils)
              EXTRA_FLAGS="--enable-gold --enable-plugins --disable-werror"
              ;;
            sqlite)
              EXTRA_FLAGS="--enable-shared --enable-static --enable-threadsafe"
              ;;
            lua)
              # Lua uses plain make, not autoconf.
              cd ../source
              case "${{ matrix.os }}" in
                linux)  make -j$(nproc) INSTALL_TOP="${INSTALL_DIR}" linux install ;;
                darwin) make -j$(sysctl -n hw.ncpu) INSTALL_TOP="${INSTALL_DIR}" macosx install ;;
              esac
              exit 0
              ;;
          esac

          ../source/configure \
            --prefix="${INSTALL_DIR}" \
            ${EXTRA_FLAGS} \
            --with-system-zlib 2>&1 | tail -20

          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          make install

      # ── Build (cmake / zig prebuilt) ───────────────────────────────────────
      - name: Configure and build (cmake/prebuilt)
        if: ${{ contains(fromJSON('["zlib","zig"]'), matrix.package) }}
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          case "${{ matrix.package }}" in
            zlib)
              cmake -S build/source -B build/build_dir \
                -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build build/build_dir --parallel
              cmake --install build/build_dir
              ;;
            zig)
              # Zig distributes prebuilt binaries; we repackage as a Kompa artifact.
              mkdir -p "${INSTALL_DIR}/bin"
              if [[ "${{ matrix.os }}" == "windows" ]]; then
                cp build/source/zig.exe "${INSTALL_DIR}/bin/"
              else
                cp build/source/zig "${INSTALL_DIR}/bin/"
                chmod +x "${INSTALL_DIR}/bin/zig"
              fi
              cp -r build/source/lib "${INSTALL_DIR}/" 2>/dev/null || true
              cp -r build/source/doc "${INSTALL_DIR}/" 2>/dev/null || true
              ;;
          esac

      # ── Package artifact ──────────────────────────────────────────────────
      - name: Package artifact
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          ARTIFACT_DIR="${PWD}/artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          ARTIFACT_NAME="${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}"

          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cd "${INSTALL_DIR}"
            zip -r "${ARTIFACT_DIR}/${ARTIFACT_NAME}.zip" .
            ARTIFACT_FILE="${ARTIFACT_NAME}.zip"
          else
            # Use zstd compression for smaller archives.
            tar -C "${INSTALL_DIR}" \
                --use-compress-program "zstd -T0 -19" \
                -cf "${ARTIFACT_DIR}/${ARTIFACT_NAME}.tar.zst" \
                .
            ARTIFACT_FILE="${ARTIFACT_NAME}.tar.zst"
          fi

          # Generate checksum.
          cd "${ARTIFACT_DIR}"
          sha256sum "${ARTIFACT_FILE}" > "${ARTIFACT_FILE}.sha256"
          echo "ARTIFACT_FILE=${ARTIFACT_FILE}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Collect all built artifacts, generate manifest.json, create the release.
  # -------------------------------------------------------------------------
  release:
    name: Create Release ${{ needs.next-tag.outputs.tag }}
    needs: [next-tag, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate manifest.json
        env:
          RELEASE_TAG: ${{ needs.next-tag.outputs.tag }}
          REPO: kompa-tbm/kompa
        run: |
          cat > /tmp/gen_manifest.py << 'PYEOF'
          import json, os, hashlib, glob, sys
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          artifact_dir = "release-artifacts"

          packages = []
          for sha_file in glob.glob(f"{artifact_dir}/**/*.sha256", recursive=True):
              with open(sha_file) as f:
                  line = f.read().strip()
              sha256, archive_name = line.split(None, 1)
              archive_name = os.path.basename(archive_name.strip())

              # Parse "name-os-arch.ext" from archive name.
              base = archive_name
              for ext in [".tar.zst", ".tar.gz", ".tar.xz", ".zip"]:
                  if base.endswith(ext):
                      base = base[:-len(ext)]
                      break

              parts = base.split("-")
              if len(parts) < 3:
                  continue

              pkg_name = parts[0]
              pkg_os = parts[1]
              pkg_arch = "-".join(parts[2:])

              archive_path = os.path.join(os.path.dirname(sha_file), archive_name)
              size = os.path.getsize(archive_path) if os.path.exists(archive_path) else 0

              packages.append({
                  "schema_version": 1,
                  "name": pkg_name,
                  "version": "latest",
                  "platform": f"{pkg_os}-{pkg_arch}",
                  "os": pkg_os,
                  "architecture": pkg_arch,
                  "archive": archive_name,
                  "sha256": sha256,
                  "size": size,
                  "download_url": f"{base_url}/{archive_name}",
                  "dependencies": [],
                  "build_time": datetime.now(timezone.utc).isoformat(),
                  "kompa_version": "0.1.0",
                  "release_tag": tag,
              })

          manifest = {
              "schema_version": 1,
              "release_tag": tag,
              "build_time": datetime.now(timezone.utc).isoformat(),
              "kompa_version": "0.1.0",
              "packages": packages,
          }

          with open("release-artifacts/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated manifest with {len(packages)} package entries.")
          PYEOF
          python3 /tmp/gen_manifest.py

      - name: Tag the release
        run: |
          TAG="${{ needs.next-tag.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-tag.outputs.tag }}
          name: "Kompa Toolchains ${{ needs.next-tag.outputs.tag }}"
          files: release-artifacts/**
          generate_release_notes: false
          body: |
            ## Toolchain Release ${{ needs.next-tag.outputs.tag }}

            This release was automatically generated by Kompa's CI system.
            Packages were built from official upstream sources and verified against their published checksums.

            ### Installing a package

            ```bash
            kompa install gcc
            kompa install sqlite
            kompa install zig
            ```

            ### Manifest

            The `manifest.json` file lists all available packages with their download URLs and SHA-256 checksums.

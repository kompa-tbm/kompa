name: Build Toolchains

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of packages to build (e.g. 'gcc lua sqlite'), or 'all'"
        required: false
        default: "all"
  schedule:
    # Rebuild toolchains weekly on Sunday at 02:00 UTC.
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  # ── Determine next sequential release tag ─────────────────────────────────
  next-tag:
    name: Determine next release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next vN tag
        id: tag
        run: |
          MAX=0
          while IFS= read -r t; do
            N="${t#v}"
            if [[ "$N" =~ ^[0-9]+$ ]] && (( N > MAX )); then MAX=$N; fi
          done < <(git tag --list 'v[0-9]*')
          NEXT=$((MAX + 1))
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: v${NEXT}"

  # ── Build matrix ───────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.package }} (${{ matrix.os }}/${{ matrix.arch }})
    needs: next-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── SQLite (Linux amd64) ───────────────────────────────────────────
          - package: sqlite
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
            build_type: autoconf

          # ── SQLite (Linux arm64) ───────────────────────────────────────────
          - package: sqlite
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
            build_type: autoconf

          # ── SQLite (macOS amd64) ───────────────────────────────────────────
          - package: sqlite
            os: darwin
            arch: amd64
            runner: macos-13
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
            build_type: autoconf

          # ── SQLite (macOS arm64) ───────────────────────────────────────────
          - package: sqlite
            os: darwin
            arch: arm64
            runner: macos-14
            version: "3.46.1"
            source_url: "https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz"
            source_sha256: "67d3fe6d268e6eaddcae3727fce58fcc8e9c53869bdd07a0c61e38ddf2965071"
            build_type: autoconf

          # ── SQLite (Windows amd64) — cmake amalgamation ──────────────────
          - package: sqlite
            os: windows
            arch: amd64
            runner: windows-2022
            version: "3.46.1"
            # SQLite's download page lists SHA3-256, not SHA-256, so we leave
            # source_sha256 empty and rely on HTTPS for transport integrity.
            source_url: "https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip"
            source_sha256: ""
            build_type: cmake_amalgamation

          # ── zlib (Linux amd64) ────────────────────────────────────────────
          - package: zlib
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "1.3.1"
            source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
            build_type: cmake

          # ── zlib (macOS arm64) ────────────────────────────────────────────
          - package: zlib
            os: darwin
            arch: arm64
            runner: macos-14
            version: "1.3.1"
            source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
            build_type: cmake

          # ── zlib (Windows amd64) ─────────────────────────────────────────
          - package: zlib
            os: windows
            arch: amd64
            runner: windows-2022
            version: "1.3.1"
            source_url: "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
            source_sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
            build_type: cmake

          # ── Lua (Linux amd64) ─────────────────────────────────────────────
          - package: lua
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "5.4.7"
            source_url: "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
            source_sha256: "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"
            build_type: lua_make

          # ── Lua (macOS arm64) ─────────────────────────────────────────────
          - package: lua
            os: darwin
            arch: arm64
            runner: macos-14
            version: "5.4.7"
            source_url: "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
            source_sha256: "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"
            build_type: lua_make

          # ── Zig 0.13.0 prebuilt (Linux amd64) ────────────────────────────
          - package: zig
            os: linux
            arch: amd64
            runner: ubuntu-22.04
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
            # Fetched from https://ziglang.org/download/0.13.0/zig-0.13.0-release-notes.html
            source_sha256: "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"
            build_type: zig_prebuilt

          # ── Zig 0.13.0 prebuilt (Linux arm64) ────────────────────────────
          - package: zig
            os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz"
            # From ziglang.org/download/index.json
            source_sha256: "041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556"
            build_type: zig_prebuilt

          # ── Zig 0.13.0 prebuilt (macOS arm64) ────────────────────────────
          - package: zig
            os: darwin
            arch: arm64
            runner: macos-14
            version: "0.13.0"
            # Note: 0.13.0 uses zig-macos-aarch64 naming (not zig-aarch64-macos)
            source_url: "https://ziglang.org/download/0.13.0/zig-macos-aarch64-0.13.0.tar.xz"
            # From ziglang.org/download/index.json
            source_sha256: "46fae219656545dfaf4dce12fb4e8685cec5b51d721beee9389ab4194d43394c"
            build_type: zig_prebuilt

          # ── Zig 0.13.0 prebuilt (Windows amd64) ──────────────────────────
          - package: zig
            os: windows
            arch: amd64
            runner: windows-2022
            version: "0.13.0"
            source_url: "https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip"
            # From ziglang.org/download/index.json
            source_sha256: "d859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158"
            build_type: zig_prebuilt

    steps:
      - uses: actions/checkout@v4

      # ── Platform-specific tool installation ──────────────────────────────
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            zlib1g-dev xz-utils curl zstd

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja zstd xz

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja 7zip

      # ── Download source ───────────────────────────────────────────────────
      - name: Download source archive
        shell: bash
        run: |
          mkdir -p build/src
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "build/src/${ARCHIVE_NAME}" "${{ matrix.source_url }}"
          echo "Downloaded ${ARCHIVE_NAME}"

      # ── Verify checksum (cross-platform) ─────────────────────────────────
      - name: Verify source checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          echo "${{ matrix.source_sha256 }}  build/src/${ARCHIVE_NAME}" | sha256sum --check
          echo "✓ Checksum verified"

      - name: Verify source checksum (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          echo "${{ matrix.source_sha256 }}  build/src/${ARCHIVE_NAME}" | shasum -a 256 --check
          echo "✓ Checksum verified"

      - name: Verify source checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "${{ matrix.source_sha256 }}"
          if ($expected -eq "") {
            Write-Host "No SHA-256 provided for this package (SQLite uses SHA3-256); skipping checksum step."
          } else {
            $archive = "build/src/$((Split-Path '${{ matrix.source_url }}' -Leaf))"
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              Write-Error "Checksum mismatch: expected $expected, got $actual"
              exit 1
            }
            Write-Host "✓ Checksum verified"
          }

      # ── Extract source ────────────────────────────────────────────────────
      - name: Extract source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME=$(basename "${{ matrix.source_url }}")
          mkdir -p build/source
          case "${ARCHIVE_NAME}" in
            *.tar.xz|*.tar.gz|*.tar.bz2|*.tar.zst)
              tar -xf "build/src/${ARCHIVE_NAME}" -C build/source --strip-components=1
              ;;
            *.zip)
              TMP=$(mktemp -d)
              unzip -q "build/src/${ARCHIVE_NAME}" -d "${TMP}"
              # Move contents of the single top-level directory.
              INNER=$(find "${TMP}" -mindepth 1 -maxdepth 1 -type d | head -1)
              mv "${INNER}"/* build/source/
              ;;
          esac
          echo "Source extracted."

      - name: Extract source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "build/src/$((Split-Path '${{ matrix.source_url }}' -Leaf))"
          New-Item -ItemType Directory -Force build\source | Out-Null
          $ext = $archive -replace '.*(\.[^.]+)$','$1'
          if ($archive -match '\.zip$') {
            $tmp = New-TemporaryFile | ForEach-Object { Remove-Item $_; New-Item -Type Directory $_ }
            Expand-Archive -Path $archive -DestinationPath $tmp
            $inner = Get-ChildItem $tmp | Select-Object -First 1
            Get-ChildItem $inner.FullName | ForEach-Object { Move-Item $_.FullName build\source\ }
          } elseif ($archive -match '\.tar\.(gz|xz|bz2)$') {
            tar -xf $archive -C build\source --strip-components=1
          }
          Write-Host "Source extracted."

      # ── Build: autoconf (SQLite Linux/macOS) ─────────────────────────────
      - name: Build (autoconf)
        if: matrix.build_type == 'autoconf'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p build/build_dir
          cd build/build_dir
          ../source/configure \
            --prefix="${INSTALL_DIR}" \
            --enable-shared \
            --enable-static \
            --enable-threadsafe \
            --disable-werror 2>&1 | tail -5
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      # ── Build: cmake (zlib all platforms) ────────────────────────────────
      - name: Build (cmake) Unix
        if: matrix.build_type == 'cmake' && runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          cmake -S build/source -B build/build_dir \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build/build_dir --parallel
          cmake --install build/build_dir

      - name: Build (cmake) Windows
        if: matrix.build_type == 'cmake' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL_DIR = "$PWD\build\install"
          cmake -S build\source -B build\build_dir `
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build\build_dir --config Release --parallel
          cmake --install build\build_dir --config Release

      # ── Build: cmake amalgamation (SQLite Windows) ───────────────────────
      - name: Build SQLite (cmake amalgamation, Windows)
        if: matrix.build_type == 'cmake_amalgamation'
        shell: pwsh
        run: |
          # The amalgamation zip contains sqlite3.c, sqlite3.h, sqlite3ext.h, shell.c
          $SRC = "$PWD\build\source"
          $BUILD = "$PWD\build\build_dir"
          $INSTALL = "$PWD\build\install"
          New-Item -ItemType Directory -Force $BUILD, "$INSTALL\bin", "$INSTALL\lib", "$INSTALL\include" | Out-Null

          # Write a minimal CMakeLists.txt to build the amalgamation
          @"
          cmake_minimum_required(VERSION 3.16)
          project(sqlite3 C)
          add_library(sqlite3 SHARED sqlite3.c)
          target_compile_definitions(sqlite3 PRIVATE
            SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_FTS5
            SQLITE_ENABLE_RTREE SQLITE_THREADSAFE=1 SQLITE_DQS=0)
          set_target_properties(sqlite3 PROPERTIES WINDOWS_EXPORT_ALL_SYMBOLS ON)
          add_executable(sqlite3_shell shell.c)
          target_link_libraries(sqlite3_shell sqlite3)
          set_target_properties(sqlite3_shell PROPERTIES OUTPUT_NAME sqlite3)
          install(TARGETS sqlite3 sqlite3_shell
            RUNTIME DESTINATION bin
            LIBRARY DESTINATION lib
            ARCHIVE DESTINATION lib)
          install(FILES sqlite3.h sqlite3ext.h DESTINATION include)
          "@ | Set-Content "$SRC\CMakeLists.txt"

          cmake -S $SRC -B $BUILD -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$INSTALL
          cmake --build $BUILD --config Release --parallel
          cmake --install $BUILD --config Release

      # ── Build: Lua (Linux/macOS) ──────────────────────────────────────────
      - name: Build Lua (make)
        if: matrix.build_type == 'lua_make'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}"
          cd build/source

          # Determine Lua make platform target
          case "${{ matrix.os }}" in
            linux)  PLAT=linux ;;
            darwin) PLAT=macosx ;;
            *)      PLAT=posix ;;
          esac

          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

          # Build first, then install — Lua's Makefile requires this order.
          make -j${NPROC} MYCFLAGS="-fPIC" ${PLAT}
          make install INSTALL_TOP="${INSTALL_DIR}"

      # ── Build: Zig (prebuilt repackage) ──────────────────────────────────
      - name: Repackage Zig (Unix)
        if: matrix.build_type == 'zig_prebuilt' && runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          mkdir -p "${INSTALL_DIR}/bin"
          cp build/source/zig "${INSTALL_DIR}/bin/zig"
          chmod +x "${INSTALL_DIR}/bin/zig"
          # Include stdlib
          cp -r build/source/lib "${INSTALL_DIR}/" 2>/dev/null || true
          cp -r build/source/doc "${INSTALL_DIR}/" 2>/dev/null || true
          echo "Zig version: $("${INSTALL_DIR}/bin/zig" version)"

      - name: Repackage Zig (Windows)
        if: matrix.build_type == 'zig_prebuilt' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL = "$PWD\build\install"
          New-Item -ItemType Directory -Force "$INSTALL\bin" | Out-Null
          Copy-Item build\source\zig.exe "$INSTALL\bin\zig.exe"
          if (Test-Path build\source\lib)  { Copy-Item -Recurse build\source\lib  "$INSTALL\lib" }
          if (Test-Path build\source\doc)  { Copy-Item -Recurse build\source\doc  "$INSTALL\doc" }
          $ver = & "$INSTALL\bin\zig.exe" version
          Write-Host "Zig version: $ver"

      # ── Package artifact (Unix: tar.zst) ─────────────────────────────────
      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${PWD}/build/install"
          ARTIFACT_DIR="${PWD}/artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          # Verify something was actually installed
          if [ -z "$(ls -A ${INSTALL_DIR} 2>/dev/null)" ]; then
            echo "ERROR: install directory is empty!"
            exit 1
          fi

          ARTIFACT_NAME="${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}"
          ARTIFACT_FILE="${ARTIFACT_NAME}.tar.zst"

          tar -C "${INSTALL_DIR}" \
              -c . \
              | zstd -T0 -19 -o "${ARTIFACT_DIR}/${ARTIFACT_FILE}"

          cd "${ARTIFACT_DIR}"
          # macOS uses shasum; Linux uses sha256sum
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ARTIFACT_FILE}" > "${ARTIFACT_FILE}.sha256"
          else
            shasum -a 256 "${ARTIFACT_FILE}" > "${ARTIFACT_FILE}.sha256"
          fi
          echo "Packaged: ${ARTIFACT_FILE} ($(du -sh ${ARTIFACT_FILE} | cut -f1))"

      # ── Package artifact (Windows: zip) ──────────────────────────────────
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $INSTALL = "$PWD\build\install"
          $ARTIFACTS = "$PWD\artifacts"
          New-Item -ItemType Directory -Force $ARTIFACTS | Out-Null

          if (-not (Get-ChildItem $INSTALL -ErrorAction SilentlyContinue)) {
            Write-Error "Install directory is empty!"
            exit 1
          }

          $ARTIFACT_NAME = "${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}"
          $ARTIFACT_FILE = "${ARTIFACT_NAME}.zip"

          # Use 7zip for reliable Windows zip creation
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "$ARTIFACTS\$ARTIFACT_FILE" "$INSTALL\*"

          $hash = (Get-FileHash "$ARTIFACTS\$ARTIFACT_FILE" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARTIFACT_FILE" | Set-Content "$ARTIFACTS\$ARTIFACT_FILE.sha256"
          Write-Host "Packaged: $ARTIFACT_FILE"

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7

  # ── Generate manifest and publish release ─────────────────────────────────
  release:
    name: Publish release ${{ needs.next-tag.outputs.tag }}
    needs: [next-tag, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate manifest.json
        env:
          RELEASE_TAG: ${{ needs.next-tag.outputs.tag }}
          REPO: kompa-tbm/kompa
        run: |
          python3 - << 'PYEOF'
          import json, os, glob
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          artifact_dir = "release-artifacts"

          packages = []
          for sha_file in sorted(glob.glob(f"{artifact_dir}/**/*.sha256", recursive=True)):
              with open(sha_file) as f:
                  line = f.read().strip()
              parts = line.split(None, 1)
              if len(parts) != 2:
                  continue
              sha256 = parts[0]
              archive_name = os.path.basename(parts[1].strip())

              base = archive_name
              for ext in [".tar.zst", ".tar.gz", ".tar.xz", ".zip"]:
                  if base.endswith(ext):
                      base = base[:-len(ext)]
                      break

              segs = base.split("-")
              if len(segs) < 3:
                  continue
              pkg_name = segs[0]
              pkg_os   = segs[1]
              pkg_arch = "-".join(segs[2:])

              archive_path = os.path.join(os.path.dirname(sha_file), archive_name)
              size = os.path.getsize(archive_path) if os.path.exists(archive_path) else 0

              packages.append({
                  "schema_version": 1,
                  "name": pkg_name,
                  "version": "latest",
                  "platform": f"{pkg_os}-{pkg_arch}",
                  "os": pkg_os,
                  "architecture": pkg_arch,
                  "archive": archive_name,
                  "sha256": sha256,
                  "size": size,
                  "download_url": f"{base_url}/{archive_name}",
                  "dependencies": [],
                  "build_time": datetime.now(timezone.utc).isoformat(),
                  "kompa_version": "0.1.0",
                  "release_tag": tag,
              })

          manifest = {
              "schema_version": 1,
              "release_tag": tag,
              "build_time": datetime.now(timezone.utc).isoformat(),
              "kompa_version": "0.1.0",
              "packages": packages,
          }
          out = "release-artifacts/manifest.json"
          with open(out, "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated manifest with {len(packages)} package entries → {out}")
          PYEOF

      - name: Create and push tag
        run: |
          TAG="${{ needs.next-tag.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Toolchain release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-tag.outputs.tag }}
          name: "Kompa Toolchains ${{ needs.next-tag.outputs.tag }}"
          files: release-artifacts/**
          generate_release_notes: false
          body: |
            ## Toolchain Release ${{ needs.next-tag.outputs.tag }}

            Pre-built packages from official upstream sources, verified by SHA-256.

            ### Install
            ```bash
            kompa install sqlite
            kompa install zlib
            kompa install lua
            kompa install zig
            ```

            The `manifest.json` attached to this release lists all packages with their checksums and download URLs.

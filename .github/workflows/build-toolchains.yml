          - {package: pcre2, os: linux,   arch: arm64, runner: ubuntu-22.04-arm, version: "10.48", build_type: cmake, configure_flags: "-DPCRE2_BUILD_PCRE2_8=ON -DPCRE2_BUILD_PCRE2_16=ON -DPCRE2_BUILD_PCRE2_32=ON -DPCRE2_SUPPORT_JIT=ON -DBUILD_SHARED_LIBS=ON", source_url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.bz2", source_sha256: "b6c68fdf6f3ac31388b50aa89ff0fc49c00c987c16e7b5146491d12003f2c8ed"}
